<!DOCTYPE html>
<html>
<head><title>Thumb Generator</title></head>
<body>
<canvas id="c"></canvas>
<script>
async function capture(videoSrc, outName) {
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    v.crossOrigin = 'anonymous';
    v.muted = true;
    v.src = videoSrc;
    v.currentTime = 1.0;
    v.onseeked = async () => {
      const c = document.getElementById('c');
      c.width = v.videoWidth || 720;
      c.height = v.videoHeight || 1280;
      const ctx = c.getContext('2d');
      ctx.drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(async (blob) => {
        await fetch('/save-thumb?name=' + encodeURIComponent(outName), {
          method: 'POST',
          body: blob
        });
        resolve();
      }, 'image/jpeg', 0.88);
    };
    v.onerror = (e) => reject(e);
  });
}

(async () => {
  try {
    await capture('/videos/goadslive-work-showcase.mp4', 'goadslive-work-showcase-thumbnail.jpg');
    await capture('/videos/goads1.mp4', 'goads1-thumbnail.jpg');
    await capture('/videos/lasya-care-nibedita-1.mp4', 'lasya-care-thumbnail.jpg');
    document.body.innerText = 'DONE';
  } catch (err) {
    document.body.innerText = 'ERROR: ' + err.message;
  }
})();
</script>
</body>
</html>
